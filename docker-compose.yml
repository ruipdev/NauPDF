services:
  pdf8:
    # GitHub Container Registry (Recommended)
    # Self-Hosted build - ghcr.io/alam00000/pdf8-simple:latest
    # Commercial build  - ghcr.io/alam00000/pdf8:latest
    # Docker Hub (Alternative)
    # Self-Hosted build - pdf8team/pdf8-simple:latest
    # Commercial build  - pdf8team/pdf8:latest
    image: ghcr.io/alam00000/pdf8-simple:latest
    container_name: pdf8
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
