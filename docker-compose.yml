services:
  naupdf:
    # GitHub Container Registry (Recommended)
    # Self-Hosted build - ghcr.io/alam00000/naupdf-simple:latest
    # Commercial build  - ghcr.io/alam00000/naupdf:latest
    # Docker Hub (Alternative)
    # Self-Hosted build - naupdfteam/naupdf-simple:latest
    # Commercial build  - naupdfteam/naupdf:latest
    image: ghcr.io/alam00000/naupdf-simple:latest
    container_name: naupdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
