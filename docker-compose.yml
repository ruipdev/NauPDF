services:
  pdffdp:
    # GitHub Container Registry (Recommended)
    # Self-Hosted build - ghcr.io/alam00000/pdffdp-simple:latest
    # Commercial build  - ghcr.io/alam00000/pdffdp:latest
    # Docker Hub (Alternative)
    # Self-Hosted build - pdffdpteam/pdffdp-simple:latest
    # Commercial build  - pdffdpteam/pdffdp:latest
    image: ghcr.io/alam00000/pdffdp-simple:latest
    container_name: pdffdp
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
